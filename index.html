<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>健康日记</title>

<!-- 让 Safari 以独立 app 的形式启动，而不是带地址栏的标签页 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<!-- 添加到主屏幕时默认使用的名字 -->
<meta name="apple-mobile-web-app-title" content="健康日记">
<meta name="theme-color" content="#0f6f75">
<!-- 关掉 iOS 把数字自动识别成电话号码的行为，血糖值会被误判 -->
<meta name="format-detection" content="telephone=no">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="stylesheet" href="css/app.css">
</head>

<body>

<!-- ============ 顶部标题栏 ============ -->
<header class="topbar">
  <h1 id="topTitle">今天</h1>
  <p id="topSub" class="topbar-sub"></p>
</header>

<main id="main">

  <!-- ============ 今天 ============ -->
  <!-- 每个页面都把自己的动态内容写进一个独立的容器，
       渲染时只清空这个容器。绝不能直接往 section 上写——
       那样会把页面里的固定控件（比如历史页的时间范围切换）一起抹掉。 -->
  <section id="view-today" class="view" hidden aria-label="今天">
    <div id="todayBody"></div>
  </section>

  <!-- ============ 历史 ============ -->
  <section id="view-history" class="view" hidden aria-label="历史">
    <div class="segmented" role="group" aria-label="时间范围">
      <button type="button" data-range="7" class="seg-btn is-on">7 天</button>
      <button type="button" data-range="30" class="seg-btn">30 天</button>
      <button type="button" data-range="90" class="seg-btn">90 天</button>
    </div>
    <div id="historyBody"></div>
  </section>

  <!-- ============ 设置 ============ -->
  <section id="view-settings" class="view" hidden aria-label="设置">
    <div id="settingsBody"></div>
  </section>

</main>

<!-- ============ 底部标签栏 ============ -->
<nav class="tabbar" role="tablist">
  <button type="button" class="tab is-on" data-view="today" role="tab" aria-selected="true">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.2 12 4l8 7.2V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg>
    <span>今天</span>
  </button>
  <button type="button" class="tab" data-view="history" role="tab" aria-selected="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16v2H2V3h2zm3.5-3.6-1.4-1.4 4.2-4.2 3 3L17 8.2l1.4 1.4-5.5 5.5-3-3z"/></svg>
    <span>历史</span>
  </button>
  <button type="button" class="tab" data-view="settings" role="tab" aria-selected="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8m0 6a2 2 0 1 1 0-4 2 2 0 0 1 0 4m8.4-1.5.1-.5-.1-.5 1.6-1.3-1.6-2.8-1.9.7a6.6 6.6 0 0 0-.9-.5L17.3 5h-3.2l-.3 1.9c-.3.1-.6.3-.9.5l-1.9-.7-1.6 2.8L11 10.8l-.1.5.1.5-1.6 1.3 1.6 2.8 1.9-.7c.3.2.6.4.9.5l.3 1.9h3.2l.3-1.9c.3-.1.6-.3.9-.5l1.9.7 1.6-2.8z"/></svg>
    <span>设置</span>
  </button>
</nav>

<!-- ============ 录入表单（全屏抽屉） ============ -->
<div id="sheet" class="sheet" hidden>
  <div class="sheet-head">
    <button type="button" id="sheetCancel" class="btn-text">取消</button>
    <h2 id="sheetTitle">记录</h2>
    <span class="sheet-head-spacer"></span>
  </div>
  <div id="sheetBody" class="sheet-body"></div>
  <div class="sheet-foot">
    <button type="button" id="sheetSave" class="btn-primary btn-xl">保存</button>
  </div>
</div>

<!-- ============ 保存成功的满屏反馈 ============ -->
<div id="saved" class="saved" hidden>
  <svg class="saved-check" viewBox="0 0 72 72" aria-hidden="true">
    <circle cx="36" cy="36" r="32"/>
    <path d="M22 37.5 31.5 47 51 26.5"/>
  </svg>
  <p class="saved-text">已保存</p>
</div>

<!-- ============ 确认对话框 ============ -->
<div id="dialog" class="dialog-wrap" hidden>
  <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dialogText">
    <p id="dialogText" class="dialog-text"></p>
    <div class="dialog-btns">
      <button type="button" id="dialogNo" class="btn-plain">取消</button>
      <button type="button" id="dialogYes" class="btn-danger">确定</button>
    </div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
